name: Prueba vídeo IA
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q gradio_client && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Generar
        run: |
          python - <<'PY'
          import os, time, shutil, urllib.request
          from gradio_client import Client, handle_file
          img = "cover.jpg"
          urllib.request.urlretrieve("https://cdn-images.dzcdn.net/images/cover/f840891b70f6e240b8ecaec49346bd6a/1000x1000-000000-80-0-0.jpg", img)
          strong = ("animated album cover, the bucking horse rears and kicks its hind legs, the rider sways and waves his arm, "
                    "lively natural motion, static camera, the background and the handwritten text stay still")
          neg = "camera movement, zoom, pan, cuts, morphing text, blurry, distorted, extra limbs, watermark, static image, frozen"
          tok = os.environ["HF_TOKEN"]
          def ltx(g, dur):
              return dict(prompt=strong, negative_prompt=neg, input_image_filepath=handle_file(img), input_video_filepath=None,
                          height_ui=512, width_ui=512, mode="image-to-video", duration_ui=dur, ui_frames_to_use=9,
                          seed_ui=7, randomize_seed=False, ui_guidance_scale=g, improve_texture_flag=True)
          tests = [
            ("ltx_g1", "Lightricks/ltx-video-distilled", "/image_to_video", ltx(1, 3)),
            ("ltx_g3", "Lightricks/ltx-video-distilled", "/image_to_video", ltx(3, 3)),
            ("wan22", "zerogpu-aoti/wan2-2-fp8da-aoti-faster", "/generate_video",
             dict(input_image=handle_file(img), prompt=strong, steps=6, negative_prompt=neg, duration_seconds=3,
                  guidance_scale=1, guidance_scale_2=1, seed=7, randomize_seed=False)),
          ]
          os.makedirs("out", exist_ok=True)
          for name, space, api, kw in tests:
              t = time.time()
              try:
                  res = Client(space, token=tok, verbose=False).predict(api_name=api, **kw)
                  path = res[0] if isinstance(res, (list, tuple)) else res
                  if isinstance(path, dict): path = path.get("video") or path.get("path")
                  shutil.copy(path, f"out/{name}.mp4")
                  print(f"[{name}] OK en {time.time()-t:.0f}s")
              except Exception as e:
                  print(f"[{name}] FALLA en {time.time()-t:.0f}s: {type(e).__name__}: {str(e)[:200]}")
          PY
      - name: Bucle ida y vuelta
        run: |
          cd out && for f in *.mp4; do ffmpeg -loglevel error -y -i "$f" -filter_complex "[0:v]reverse[r];[0:v][r]concat=n=2:v=1[v]" -map "[v]" -c:v libx264 -pix_fmt yuv420p "loop_$f"; done; ls -la
      - uses: actions/upload-artifact@v4
        with: { name: videos, path: out/ }
