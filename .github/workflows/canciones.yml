# Baja las canciones que piden los móviles de Antuan Music y las sube al almacén privado de Supabase,
# sin el PC encendido. Supabase avisa al pedir una canción (repository_dispatch "nueva-cancion",
# ver supabase_aviso_canciones.sql); también se puede lanzar a mano desde la pestaña Actions.
name: Canciones

on:
  repository_dispatch:
    types: [nueva-cancion]
  workflow_dispatch:
    inputs:
      ritmo:
        description: 'Analizar el ritmo (Modo Teclas) de las canciones que ya están en Supabase'
        type: boolean
        default: false
  schedule:
    - cron: '41 */3 * * *' # red de seguridad por si algún aviso se pierde

concurrency:
  group: canciones
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: ¿Hay canciones en la cola?
        id: cola
        run: |
          n=$(curl -s "$SUPABASE_URL/rest/v1/song_files?status=in.(queued,processing)&select=video_id" -H "apikey: $SUPABASE_SERVICE_KEY" | grep -o video_id | wc -l)
          # a mano con "ritmo": corre aunque la cola esté vacía
          if [ "${{ inputs.ritmo }}" = "true" ]; then n=1; fi
          echo "pendientes=$n" >> "$GITHUB_OUTPUT"
          echo "Pendientes: $n"

      - uses: actions/checkout@v4
        if: steps.cola.outputs.pendientes != '0'

      - uses: actions/setup-python@v5
        if: steps.cola.outputs.pendientes != '0'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: canciones_requirements.txt

      - uses: denoland/setup-deno@v2
        if: steps.cola.outputs.pendientes != '0'
        with:
          deno-version: v2.x

      # ffmpeg estático guardado en caché: no se instala de cero en cada tanda
      - name: ffmpeg (caché)
        if: steps.cola.outputs.pendientes != '0'
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      - name: Descargar ffmpeg (solo la primera vez)
        if: steps.cola.outputs.pendientes != '0' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg && cd ~/ffmpeg
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'

      - name: Instalar yt-dlp
        if: steps.cola.outputs.pendientes != '0'
        run: |
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          pip install -q -U -r canciones_requirements.txt
          yt-dlp --version
          ~/ffmpeg/ffmpeg -version | head -1

      - name: Bajar y subir canciones
        if: steps.cola.outputs.pendientes != '0'
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          # sesión de una cuenta de Google APARTE (secreto YT_COOKIES, formato cookies.txt); sin ella YouTube
          # pide "confirma que no eres un bot" a los servidores de GitHub
          if [ -n "$YT_COOKIES" ]; then echo "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"; export YT_COOKIES_FILE="$RUNNER_TEMP/cookies.txt"; fi
          python -X utf8 song_worker.py --drain
          if [ "${{ inputs.ritmo }}" = "true" ]; then pip install -q librosa && python -X utf8 song_worker.py --ritmo; fi
