# Genera las portadas animadas de Antuan Music en los servidores de GitHub (sin el PC encendido).
# Se lanza cuando Supabase avisa de que alguien ha encargado una portada nueva (repository_dispatch),
# o a mano desde la pestaña Actions. Procesa toda la cola y se apaga.
name: Portadas

on:
  repository_dispatch:
    types: [nueva-portada]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # red de seguridad cada 6 h (avisos perdidos) y rehacer con IA cuando vuelve el cupo de Hugging Face

concurrency:
  group: portadas
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LIVEPORTRAIT_DIR: ${{ github.workspace }}/LivePortrait
      HF_HOME: ${{ github.workspace }}/.hf
      LOOP_FPS: '24'
      LOOP_SECONDS: '3'
      FACE_KEYFRAMES: '7'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay portadas en la cola?
        id: cola
        run: |
          n=$(curl -s "$SUPABASE_URL/rest/v1/cover_loops?status=in.(queued,processing)&select=cover_key" -H "apikey: $SUPABASE_SERVICE_KEY" | grep -o cover_key | wc -l)
          # portadas hechas sin vídeo IA (cupo diario de Hugging Face gastado): se rehacen cuando hay cupo
          m=$(curl -s -G "$SUPABASE_URL/rest/v1/cover_loops" --data-urlencode "status=eq.done" --data-urlencode "video_path=not.like.ai-*" --data-urlencode "select=cover_key" --data-urlencode "limit=1" -H "apikey: $SUPABASE_SERVICE_KEY" | grep -o cover_key | wc -l)
          [ -z "$HF_TOKEN" ] && m=0
          echo "pendientes=$((n + m))" >> "$GITHUB_OUTPUT"
          echo "Pendientes: $n · sin vídeo IA por rehacer: $m"

      - uses: actions/setup-python@v5
        if: steps.cola.outputs.pendientes != '0'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Modelos (caché)
        if: steps.cola.outputs.pendientes != '0'
        id: modelos
        uses: actions/cache@v4
        with:
          path: |
            LivePortrait
            .hf
          key: modelos-v1

      - name: Descargar modelos (solo la primera vez)
        if: steps.cola.outputs.pendientes != '0' && steps.modelos.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/KwaiVGI/LivePortrait.git LivePortrait
          pip install -q huggingface_hub
          python -c "from huggingface_hub import snapshot_download as s; s('KwaiVGI/LivePortrait', local_dir='LivePortrait/pretrained_weights', allow_patterns=['liveportrait/*','insightface/*'])"

      - name: Instalar dependencias
        if: steps.cola.outputs.pendientes != '0'
        run: pip install -q -r requirements.txt

      - name: Generar y subir portadas
        if: steps.cola.outputs.pendientes != '0'
        run: python -X utf8 -c "import animate_worker as w; print('hechas:', w.drain(max_seconds=40*60))"
